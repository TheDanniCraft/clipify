name: 🧪 CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: 🔎 Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🔎 Detect Runner changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            runner:
              - "packages/runner/**"
              - "scripts/fingerprint-runner.mjs"
              - "scripts/run-runner-self-test.mjs"
              - "scripts/write-runner-metadata.mjs"
              - "scripts/validate-runner-matrix.mjs"
              - "scripts/create-runner-manifest.mjs"
              - "scripts/runner-package-cleanup.mjs"
              - ".github/workflows/runner-native.yml"

  deps:
    name: ♻️ Prepare dependency cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.compute-key.outputs.key }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # compute the cache key once so downstream jobs can reuse it
      - name: 🔑 Compute cache key
        id: compute-key
        run: echo "key=${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/package.json', '**/patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      # try to restore an existing cache
      - name: ♻️ Restore Bun & node_modules cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ steps.compute-key.outputs.key }}

      # Always validate the lockfile and patches, even when node_modules came from cache.
      - name: 📦 Validate and install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: 🩹 Verify patched dependencies
        run: bun run patches:validate

      # save a new cache entry when we had a miss
      - name: 💾 Save Bun & node_modules cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ steps.compute-key.outputs.key }}

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🧹 Run lint
        run: bun run app:lint

  typecheck:
    name: 🔎 Typecheck
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🔎 Run TypeScript checks
        run: bun run app:typecheck

  format:
    name: 🎨 Format
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
        with:
          # Check the files introduced by the latest atomic change without forcing
          # a repository-wide rewrite of legacy formatting debt.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🎨 Check formatting
        run: bun run app:prettier:check

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: deps
    env:
      MCP_PROBE_RUNTIME: node
      MCP_TEST_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clipify_e2e
          POSTGRES_PASSWORD: clipify_e2e
          POSTGRES_USER: clipify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipify_e2e -d clipify_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🟢 Set up verified Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3

      - name: 🧪 Run tests with coverage
        run: bun run test:coverage

      - name: 🔎 Enforce MCP source coverage
        run: node scripts/check-mcp-coverage.mjs

      - name: 📦 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: 📦 Upload MCP native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-native-evidence
          path: test-results/mcp/
          if-no-files-found: ignore
          retention-days: 30

  browser-tests:
    name: 🌐 Browser tests
    runs-on: ubuntu-latest
    needs: deps
    concurrency:
      group: clipify-e2e-database
      cancel-in-progress: false
    env:
      CLIPIFY_E2E_SCHEMA_PUSH: "1"
      APP_ENV: "test"
      E2E_TEST_MODE: "true"
      MCP_BROWSER_PROVIDER_FIXTURE: "true"
      MCP_COVERAGE_PROBE_DIRECTORY: ${{ github.workspace }}/test-results/mcp/browser-native-probes
      DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      MCP_TEST_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      MCP_BROWSER_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      MCP_PROBE_RUNTIME: node
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clipify_e2e
          POSTGRES_PASSWORD: clipify_e2e
          POSTGRES_USER: clipify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipify_e2e -d clipify_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🟢 Set up verified Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3

      - name: 🗃️ Prepare disposable E2E database
        run: bun run db:push:e2e

      - name: 🌐 Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: 🧩 Compile native application probes once
        run: |
          node --input-type=module -e "import { buildMcpCoverageProbes } from './scripts/build-mcp-coverage-probes.mjs'; await buildMcpCoverageProbes({ outputDirectory: 'test-results/mcp/browser-native-probes' });"

      - name: 🔎 Require nonempty generated BDD and ATDD scenarios
        run: |
          bunx bddgen
          node scripts/check-generated-scenarios.mjs

      - name: 🧪 Run acceptance and BDD browser tests
        run: bun run test:e2e

      - name: 🔎 Run browser compliance audit
        run: bun run test:compliance

      - name: 📦 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: 📦 Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: ⚡ Cache Next.js build
        uses: actions/cache@v6
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lockb') }}-

      - name: 🏗️ Run build
        run: bun run app:build

      - name: 🔐 Verify server action manifest boundaries
        run: bun run app:check-action-manifest

  runner:
    name: 🏃 Runner typecheck and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: 📦 Install Runner dependencies
        working-directory: packages/runner
        run: bun install --frozen-lockfile
      - name: 🩹 Verify Runner patched dependencies
        working-directory: packages/runner
        run: bun run patches:validate
      - name: 🔐 Verify native keyring binding
        working-directory: packages/runner
        run: node check-native.mjs
      - name: 🧭 Typecheck Runner
        working-directory: packages/runner
        run: bun run typecheck
      - name: 🧪 Test Runner
        working-directory: packages/runner
        run: bun run test

  runner-manifest:
    name: 📋 Verify Runner manifest extraction
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Test scratch-image manifest extraction
        run: |
          set -euo pipefail
          manifest_dir="$(mktemp -d)"
          printf '{"schemaVersion":1}\n' > "$manifest_dir/manifest.json"
          printf 'FROM scratch\nCOPY manifest.json /manifest.json\n' > "$manifest_dir/Dockerfile"
          docker build --tag clipify-runner-manifest-test "$manifest_dir"
          container="$(docker create clipify-runner-manifest-test /bin/true)"
          trap 'docker rm "$container" >/dev/null 2>&1 || true; rm -rf "$manifest_dir"' EXIT
          docker cp "$container:/manifest.json" "$manifest_dir/copied-manifest.json"
          cmp "$manifest_dir/manifest.json" "$manifest_dir/copied-manifest.json"
