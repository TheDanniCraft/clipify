name: 🧪 CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 🔎 Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.filter.outputs.runner }}
      full: ${{ steps.mode.outputs.full }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🔎 Select validation mode
        id: mode
        run: |
          node -e "const fs=require('node:fs');const {fullValidationRequired}=require('./scripts/test-execution.cjs');const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'full='+fullValidationRequired(event,process.env.GITHUB_EVENT_NAME)+'\n');"

      - name: 🔎 Detect Runner changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            runner:
              - "packages/runner/**"
              - "scripts/fingerprint-runner.mjs"
              - "scripts/run-runner-coverage-lane.mjs"
              - "scripts/merge-runner-coverage.mjs"
              - "scripts/runner-test-sharding.cjs"
              - "scripts/plan-runner-shards.cjs"
              - "scripts/run-runner-self-test.mjs"
              - "scripts/write-runner-metadata.mjs"
              - "scripts/validate-runner-matrix.mjs"
              - "scripts/create-runner-manifest.mjs"
              - "scripts/runner-package-cleanup.mjs"
              - "scripts/coverage-counters.mjs"
              - "scripts/coverage-source-fingerprint.mjs"
              - ".github/workflows/ci.yml"
              - ".github/workflows/runner-native.yml"

  deps:
    name: ♻️ Prepare dependency cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.compute-key.outputs.key }}
      browser-cache-key: ${{ steps.compute-browser-key.outputs.key }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # compute the cache key once so downstream jobs can reuse it
      - name: 🔑 Compute cache key
        id: compute-key
        run: echo "key=${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/package.json', '**/patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      # try to restore an existing cache
      - name: ♻️ Restore Bun & node_modules cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ steps.compute-key.outputs.key }}

      # Always validate the lockfile and patches, even when node_modules came from cache.
      - name: 📦 Validate and install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: bun install --frozen-lockfile

      - name: 🩹 Verify patched dependencies
        run: bun run patches:validate

      # save a new cache entry when we had a miss
      - name: 💾 Save Bun & node_modules cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ steps.compute-key.outputs.key }}

      - name: 🔑 Compute installed browser cache key
        id: compute-browser-key
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json', 'node_modules/playwright-core/browsers.json') }}" >> "$GITHUB_OUTPUT"
      - name: ♻️ Restore shared Chromium binaries
        id: browser-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.compute-browser-key.outputs.key }}
      - name: 🌐 Ensure matching Chromium binaries
        run: bunx playwright install chromium
      - name: 💾 Save shared Chromium binaries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.compute-browser-key.outputs.key }}

  draft-tests:
    name: 🧪 Scoped draft checks
    if: needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    needs: [deps, changes]
    env:
      MCP_PROBE_RUNTIME: node
      MCP_TEST_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      JWT_SECRET: clipify-e2e-jwt-secret-not-for-production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clipify_e2e
          POSTGRES_PASSWORD: clipify_e2e
          POSTGRES_USER: clipify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipify_e2e -d clipify_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🧪 Run affected tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-scoped-tests.mjs "$BASE_SHA"

  browser-build:
    name: 🏗️ Shared browser build
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    needs: [deps, changes]
    env:
      MCP_BROWSER_PROVIDER_FIXTURE: "true"
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🏗️ Build isolated browser application
        run: bun run test:e2e:build
      - name: 📦 Pack browser runtime without compilation caches
        run: node scripts/browser-build-artifact.mjs pack .next-playwright "${{ runner.temp }}/browser-build.tar.gz"
      - name: 📦 Share exact browser build
        uses: actions/upload-artifact@v7
        with:
          name: browser-build
          path: ${{ runner.temp }}/browser-build.tar.gz
          compression-level: 0
          retention-days: 2

  test:
    name: 🧪 Test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [deps, changes, coverage-lanes, browser-tests, draft-tests, runner, runner-coverage, validation-plan]
    env:
      CLIPIFY_WORKFLOW_SHARD_PLAN: ${{ github.workspace }}/test-results/workflow-shard-plan.json
    permissions:
      contents: read
      actions: read
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🟢 Match coverage producer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🔒 Require complete validation before merge
        env:
          FULL: ${{ needs.changes.outputs.full }}
          COVERAGE: ${{ needs.coverage-lanes.result }}
          BROWSER: ${{ needs.browser-tests.result }}
          RUNNER_REQUIRED: ${{ needs.changes.outputs.runner }}
          RUNNER: ${{ needs.runner-coverage.result }}
        run: |
          test "$FULL" = "true" || { echo "Draft feedback is scoped. Mark ready for the mandatory full gate."; exit 1; }
          test "$COVERAGE" = "success"
          test "$BROWSER" = "success"
          if [ "$RUNNER_REQUIRED" = "true" ]; then test "$RUNNER" = "success"; fi
      - name: 📥 Download all coverage lanes
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-lanes/
      - name: 📥 Download native workflow plan
        uses: actions/download-artifact@v8
        with:
          name: workflow-shard-plan
          path: test-results/
      - name: 🔎 Merge evidence and enforce unchanged thresholds
        run: |
          bunx bddgen
          node scripts/check-generated-scenarios.mjs
          node scripts/merge-test-coverage.mjs
      - name: 📥 Download browser scenario execution evidence
        uses: actions/download-artifact@v8
        with:
          pattern: browser-timing-*
          path: test-results/browser-timings/
      - name: 🔎 Verify complete browser inventory and refresh scheduling timings
        run: node scripts/update-browser-durations.cjs test-results/browser-timings .cache/test/browser-durations.json
      - name: 💾 Save optional browser timing history
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/test/browser-durations.json
          key: ${{ runner.os }}-browser-durations-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 💾 Refresh optional native workflow timing history
        continue-on-error: true
        run: |
          mkdir -p .cache/test
          cp coverage/workflow-durations.json .cache/test/workflow-durations.json
      - uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/test/workflow-durations.json
          key: ${{ runner.os }}-workflow-durations-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 📊 Report queue, setup and test execution time
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-ci-timings.cjs
      - name: 📦 Upload complete coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🧹 Run lint
        run: bun run app:lint

  typecheck:
    name: 🔎 Typecheck
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🔎 Run TypeScript checks
        run: bun run app:typecheck

  format:
    name: 🎨 Format
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
        with:
          # Check the files introduced by the latest atomic change without forcing
          # a repository-wide rewrite of legacy formatting debt.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🎨 Check formatting
        run: bun run app:prettier:check

  validation-plan:
    name: 🔀 Plan test execution
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    needs: [deps, changes]
    outputs:
      coverage_matrix: ${{ steps.plan.outputs.matrix }}
      browser_matrix: ${{ steps.browser.outputs.matrix }}
      runner_matrix: ${{ steps.runner.outputs.matrix }}
    env:
      MCP_BROWSER_PROVIDER_FIXTURE: "false"
      CLIPIFY_TEST_DURATION_FILE: .cache/test/workflow-durations.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}
      - name: 📦 Install native metadata dependencies
        working-directory: packages/runner
        run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/test/workflow-durations.json
          key: ${{ runner.os }}-workflow-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-workflow-durations-
      - name: 🔀 Plan elapsed-work-based coverage jobs
        id: plan
        run: |
          bunx bddgen --config playwright.mcp.config.ts
          node scripts/plan-workflow-shards.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: workflow-shard-plan
          path: test-results/workflow-shard-plan.json
          retention-days: 2

      - name: ♻️ Restore optional browser timing history
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/test/browser-durations.json
          key: ${{ runner.os }}-browser-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-browser-durations-
      - name: 🔀 Plan browser scenarios from measured work
        id: browser
        env:
          CLIPIFY_TEST_DURATION_FILE: .cache/test/browser-durations.json
        run: node scripts/plan-browser-shards.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: browser-shard-plan
          path: test-results/browser-shard-plan.json
          retention-days: 2
      - name: ♻️ Restore optional Runner timing history
        if: needs.changes.outputs.runner == 'true'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/test/runner-durations.json
          key: ${{ runner.os }}-runner-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-runner-durations-
      - name: 🔀 Plan Runner files from measured work
        if: needs.changes.outputs.runner == 'true'
        id: runner
        env:
          CLIPIFY_TEST_DURATION_FILE: .cache/test/runner-durations.json
        run: node scripts/plan-runner-shards.cjs
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.runner == 'true'
        with:
          name: runner-shard-plan
          path: test-results/runner-shard-plan.json
          retention-days: 2

  coverage-lanes:
    name: 🧪 Coverage (${{ matrix.lane }})
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    needs: [deps, changes, validation-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validation-plan.outputs.coverage_matrix) }}
    env:
      CLIPIFY_WORKFLOW_SHARD_PLAN: ${{ github.workspace }}/test-results/workflow-shard-plan.json
      MCP_PROBE_RUNTIME: node
      MCP_TEST_TEMPLATE_ID: coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      MCP_TEST_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      JWT_SECRET: clipify-e2e-jwt-secret-not-for-production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clipify_e2e
          POSTGRES_PASSWORD: clipify_e2e
          POSTGRES_USER: clipify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipify_e2e -d clipify_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🟢 Set up verified Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: 📥 Download immutable workflow coverage plan
        uses: actions/download-artifact@v8
        with:
          name: workflow-shard-plan
          path: test-results/
      - name: 🔎 Verify execution policy and automation
        if: matrix.lane == 'unit' || matrix.lane == 'unit-1'
        run: node --test scripts/*.test.cjs scripts/*.test.mjs

      - name: 📦 Install workflow Runner dependencies
        if: startsWith(matrix.lane, 'workflows')
        working-directory: packages/runner
        run: |
          bun install --frozen-lockfile
          bun run patches:validate
          node check-native.mjs
      - name: 🌐 Prepare workflow media browser
        if: startsWith(matrix.lane, 'workflows-media')
        working-directory: packages/runner
        run: node test/support/prepare-media.mjs
      - name: 🎞️ Install workflow media dependencies
        if: startsWith(matrix.lane, 'workflows-media')
        run: bash scripts/install-runner-media-deps.sh
      - name: 🧪 Run owning coverage lane
        run: node scripts/run-coverage-lane.mjs ${{ matrix.lane }}

      - name: 📦 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.lane }}
          path: coverage/${{ matrix.lane }}/
          retention-days: 30

      - name: 🧹 Remove job-owned schema template
        if: always()
        run: node scripts/cleanup-mcp-fixture-template.mjs

      - name: 📦 Upload MCP native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-native-evidence-${{ matrix.lane }}
          path: test-results/mcp/
          if-no-files-found: ignore
          retention-days: 30

  browser-tests:
    if: needs.changes.outputs.full == 'true'
    name: 🌐 Browser tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [deps, changes, browser-build, validation-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validation-plan.outputs.browser_matrix) }}
    env:
      CLIPIFY_BROWSER_SHARD_PLAN: test-results/browser-shard-plan.json
      INSTANCE_HEALTH_TOKEN: clipify-e2e-instance-health-not-for-production
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-timing-${{ matrix.label }}.json
      CLIPIFY_E2E_SCHEMA_PUSH: "1"
      APP_ENV: "test"
      E2E_TEST_MODE: "true"
      MCP_BROWSER_PROVIDER_FIXTURE: "true"
      MCP_COVERAGE_PROBE_DIRECTORY: ${{ github.workspace }}/test-results/mcp/browser-native-probes
      DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      MCP_TEST_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      JWT_SECRET: clipify-e2e-jwt-secret-not-for-production
      MCP_BROWSER_DATABASE_URL: postgresql://clipify_e2e:clipify_e2e@127.0.0.1:5432/clipify_e2e
      MCP_PROBE_RUNTIME: node
      MCP_TEST_TEMPLATE_ID: browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clipify_e2e
          POSTGRES_PASSWORD: clipify_e2e
          POSTGRES_USER: clipify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipify_e2e -d clipify_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: 🟢 Set up verified Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: 🗃️ Prepare disposable E2E database
        run: bun run db:push:e2e

      - name: ♻️ Restore shared Chromium binaries
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ needs.deps.outputs.browser-cache-key }}
      - name: 🌐 Verify browser libraries and matching Chromium
        run: bash scripts/install-playwright-chromium.sh

      - name: 📦 Install BDD native presentation dependencies
        if: matrix.native_media == true
        working-directory: packages/runner
        run: |
          bun install --frozen-lockfile
          bun run patches:validate
          node check-native.mjs
      - name: 🌐 Prepare BDD native presentation browser
        if: matrix.native_media == true
        working-directory: packages/runner
        run: node test/support/prepare-media.mjs
      - name: 🎞️ Install BDD native media system dependencies
        if: matrix.native_media == true
        run: bash scripts/install-runner-media-deps.sh
      - name: 🎞️ Prepare frame decoding only where required
        if: matrix.ffmpeg == true && matrix.native_media != true
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: 🧩 Compile native application probes once
        run: |
          node --input-type=module -e "import { buildMcpCoverageProbes } from './scripts/build-mcp-coverage-probes.mjs'; await buildMcpCoverageProbes({ outputDirectory: 'test-results/mcp/browser-native-probes' });"

      - name: 🔎 Require nonempty generated BDD and ATDD scenarios
        run: |
          bunx bddgen
          node scripts/check-generated-scenarios.mjs

      # Each matrix job owns its loopback PostgreSQL service and browser server.
      # Keep one browser worker per job so native provider timing checks stay isolated.
      - name: 🔎 Run compliance inventory audit
        if: matrix.project == 'compliance-chromium'
        run: bunx jest --runInBand test/compliance/inventory-audit.test.ts

      - name: 📥 Download tested browser build
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: ${{ runner.temp }}/browser-build
      - name: 📦 Restore exact browser runtime
        run: node scripts/browser-build-artifact.mjs unpack "${{ runner.temp }}/browser-build/browser-build.tar.gz" .next-playwright

      - name: 📥 Download immutable browser shard plan
        uses: actions/download-artifact@v8
        with:
          name: browser-shard-plan
          path: test-results/
      - name: 🧪 Run complete browser project shard
        run: node scripts/run-browser-shard.mjs ${{ matrix.project }} ${{ matrix.shard }}

      - name: 📦 Upload successful BDD timing evidence
        if: success() && matrix.project == 'bdd-chromium'
        uses: actions/upload-artifact@v7
        with:
          name: browser-timing-${{ matrix.label }}
          path: test-results/browser-timing-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 2
      - name: 🧹 Remove job-owned schema template
        if: always()
        run: node scripts/cleanup-mcp-fixture-template.mjs

      - name: 📦 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.label }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: 📦 Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.label }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ♻️ Restore deps cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}

      - name: ⚡ Cache Next.js build
        uses: actions/cache@v6
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}-

      - name: 🏗️ Run build
        run: bun run app:build

      - name: 🔐 Verify server action manifest boundaries
        run: bun run app:check-action-manifest

  runner:
    name: 🏃 Runner tests (${{ matrix.label }})
    runs-on: ubuntu-24.04
    needs: [changes, deps, validation-plan]
    if: needs.changes.outputs.runner == 'true' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validation-plan.outputs.runner_matrix) }}
    env:
      RUNNER_TEST_SHARD_PLAN: ${{ github.workspace }}/test-results/runner-shard-plan.json
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Match native test Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: 🟢 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: ♻️ Restore shared test dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: 📦 Install Runner dependencies
        working-directory: packages/runner
        run: bun install --frozen-lockfile
      - name: 🛡️ Audit Runner dependencies
        working-directory: packages/runner
        run: bun audit --audit-level=high
      - name: 🩹 Verify Runner patched dependencies
        working-directory: packages/runner
        run: bun run patches:validate
      - name: 🔐 Verify native keyring binding
        working-directory: packages/runner
        run: node check-native.mjs
      - name: 🧭 Typecheck Runner
        working-directory: packages/runner
        run: bun run typecheck
      - name: 🌐 Prepare native media test browser
        working-directory: packages/runner
        run: node test/support/prepare-media.mjs
      - name: 🎞️ Install native media test system dependencies
        run: bash scripts/install-runner-media-deps.sh
      - name: 📥 Download immutable native shard plan
        uses: actions/download-artifact@v8
        with:
          name: runner-shard-plan
          path: test-results/
      - name: 🧪 Test Runner shard
        run: node scripts/run-runner-coverage-lane.mjs --shard=${{ matrix.shard }}
      - name: 📦 Retain native coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: runner-native-${{ matrix.label }}
          path: packages/runner/coverage/runner-shard-${{ matrix.index }}/
          if-no-files-found: error

  runner-coverage:
    name: 🏃 Runner coverage gate
    runs-on: ubuntu-24.04
    needs: [changes, deps, runner]
    if: needs.changes.outputs.runner == 'true' && needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/install/global
            **/node_modules
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: 📦 Install native test discovery dependencies
        working-directory: packages/runner
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: runner-native-runner-*
          path: test-results/runner-coverage-lanes/
      - uses: actions/download-artifact@v8
        with:
          name: runner-shard-plan
          path: test-results/
      - name: 🔎 Merge complete native evidence and enforce unchanged thresholds
        run: node scripts/merge-runner-coverage.mjs test-results/runner-coverage-lanes test-results/runner-shard-plan.json
      - name: 💾 Refresh optional native scheduling history
        continue-on-error: true
        run: |
          mkdir -p .cache/test
          cp packages/runner/coverage/runner-feature/runner-durations.json .cache/test/runner-durations.json
      - uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/test/runner-durations.json
          key: ${{ runner.os }}-runner-durations-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        with:
          name: runner-native-coverage
          path: packages/runner/coverage/runner-feature/
          if-no-files-found: error

  runner-manifest:
    name: 📋 Verify Runner manifest extraction
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Test scratch-image manifest extraction
        run: |
          set -euo pipefail
          manifest_dir="$(mktemp -d)"
          printf '{"schemaVersion":1}\n' > "$manifest_dir/manifest.json"
          printf 'FROM scratch\nCOPY manifest.json /manifest.json\n' > "$manifest_dir/Dockerfile"
          docker build --tag clipify-runner-manifest-test "$manifest_dir"
          container="$(docker create clipify-runner-manifest-test /bin/true)"
          trap 'docker rm "$container" >/dev/null 2>&1 || true; rm -rf "$manifest_dir"' EXIT
          docker cp "$container:/manifest.json" "$manifest_dir/copied-manifest.json"
          cmp "$manifest_dir/manifest.json" "$manifest_dir/copied-manifest.json"
